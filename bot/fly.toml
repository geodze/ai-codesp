# Fly.io app config for the Telegram bot.
#
# IMPORTANT: run `fly deploy` from the **repo root** with this config:
#   fly deploy --config bot/fly.toml
# That way the Docker build context is the repo root, which is what
# bot/Dockerfile expects (it does `COPY bot/requirements.txt`).
#
# Bootstrap:
#   1. Install flyctl: https://fly.io/docs/flyctl/install/
#   2. fly auth login
#   3. From repo root: fly launch --no-deploy --copy-config --name <your-app-name> --config bot/fly.toml
#      (then edit `app = "..."` below to match)
#   4. fly volumes create bot_data --region fra --size 1 --app <your-app-name>
#   5. fly secrets set BOT_TOKEN=123456:AAA... --app <your-app-name>
#   6. fly deploy --config bot/fly.toml
#
# All config beyond BOT_TOKEN is done via Telegram /start wizard.

app = "codesp-bot"
primary_region = "fra"  # Frankfurt; change to one closer to you if needed

[build]
  dockerfile = "bot/Dockerfile"

[env]
  BOT_MODE = "polling"
  DATA_DIR = "/data/bot-data"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false  # always-on, polling needs continuous outbound
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

# Persistent volume so data/state.json (and inbox.log) survive redeploys.
# Create once with: fly volumes create bot_data --region fra --size 1
[mounts]
  source = "bot_data"
  destination = "/data"
